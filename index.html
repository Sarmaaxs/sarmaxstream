<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08080a" />
    <meta name="description" content="Sarmaxstream: stream music with lyrics, movies, TV shows, anime and books." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Sarmaxstream</title>
    <link rel="canonical" href="https://sarmaxstreams.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sarmaxstream" />
    <meta property="og:title" content="Sarmaxstream" />
    <meta property="og:description" content="Music with lyrics, movies, TV, anime and books." />
    <meta property="og:image" content="https://sarmaxstreams.vercel.app/icon-512.png" />
    <meta name="twitter:card" content="summary" />

    <!-- Dark background right away so there is no white flash while the app loads -->
    <style>html,body{background:#08080a;color:#fff;margin:0}</style>

    <!-- Open connections early (saves ~100-300ms on first load) -->
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Fonts: loaded without blocking the page (text shows instantly, font swaps in) -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
