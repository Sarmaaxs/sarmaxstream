name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Create the Android project
        run: npx cap add android

      - name: Native features (pop-ups, back button, music notification, video, shortcuts)
        run: |
          DIR=android/app/src/main/java/com/sarmaxstream/app
          mkdir -p "$DIR"
          cp MainActivity.java "$DIR/MainActivity.java"
          cp AudioKeepAliveService.java "$DIR/AudioKeepAliveService.java"
          cp SxWidgetProvider.java "$DIR/SxWidgetProvider.java"
          python3 patch_android.py android
          grep -n "AudioKeepAliveService\|SxWidgetProvider\|FOREGROUND_SERVICE" android/app/src/main/AndroidManifest.xml

      - name: Icon and splash screen
        run: |
          pip install pillow
          python3 make_assets.py
          npx capacitor-assets generate --android

      - name: Harden and version the app
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' "$M"
          G=android/app/build.gradle
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" "$G"
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" "$G"
          npx cap sync android

      - name: Build and sign
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            ./gradlew assembleRelease --no-daemon
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            KS_PASS="$KEYSTORE_PASSWORD" "$BT/apksigner" sign \
              --ks "$RUNNER_TEMP/release.keystore" --ks-pass env:KS_PASS \
              --ks-key-alias "$KEY_ALIAS" --key-pass env:KS_PASS \
              --out ../sarmaxstream.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" verify ../sarmaxstream.apk
            rm -f "$RUNNER_TEMP/release.keystore"
          else
            echo "::warning::No signing key set. Building a debug-signed APK (installs fine, but use a real key for long-term updates)."
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../sarmaxstream.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: sarmaxstream-apk
          path: mobile/sarmaxstream.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Sarmaxstream APK #${{ github.run_number }}
          files: mobile/sarmaxstream.apk
          prerelease: ${{ env.KEYSTORE_BASE64 == '' }}
